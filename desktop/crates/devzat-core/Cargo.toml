[package]
name = "devzat-core"
description = "Connection, protocol, and text handling shared by the Devzat desktop clients"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
log.workspace = true
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
emojis = "0.8"
thiserror = "2"

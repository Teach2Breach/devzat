[workspace]
resolver = "3"
members = ["crates/devzat-core", "crates/devzat-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/Teach2Breach/devzat"

[workspace.dependencies]
devzat-core = { path = "crates/devzat-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
log = "0.4"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2

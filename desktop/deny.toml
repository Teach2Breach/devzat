# License policy for `cargo deny check licenses`. Everything shipped must be free to redistribute.
[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9
